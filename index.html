<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07342f" />
  <title>旅行票根</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="stage" id="top">
    <section class="ticket-wrap" id="ticket-wrap">
      <article class="ticket" id="ticket" aria-label="旅行票根，点击副券撕开">
        <div class="ticket-photo" id="ticket-photo"><div class="ticket-cover-blur"></div><img class="ticket-cover-image" id="ticket-cover-image" alt="" /></div>
        <button class="stub" id="stub" type="button" aria-label="撕开票根">
          <span class="tear-edge" aria-hidden="true"></span>
          <strong class="city" id="ticket-city">GUANG<br>ZHOU</strong>
          <span class="date" id="ticket-date">2026 · 02</span>
          <span class="number">NO.848620</span>
          <span class="code">Z1B851L9</span>
          <span class="barcode" aria-hidden="true"></span>
          <span class="notch" aria-hidden="true"></span>
        </button>
        <div class="memory" id="memory" aria-hidden="true">
          <button class="close-memory" type="button" aria-label="恢复票根">×</button>
          <div class="progress"><i></i></div>
        </div>
      </article>

      <div class="actions" id="ticket-actions">
        <button class="action" id="edit-ticket" type="button"><span>＋</span> 更换</button>
        <button class="action danger" id="delete-ticket" type="button"><span>⌫</span> 删除</button>
        <button class="action primary" id="download-ticket" type="button"><span>↓</span> 下载</button>
      </div>
    </section>

    <section class="empty" id="empty" hidden>
      <button id="new-ticket" type="button"><span>＋</span>制作一张旅行票根</button>
    </section>
  </main>

  <div class="modal" id="editor" hidden>
    <button class="backdrop" data-close="editor" aria-label="关闭编辑器"></button>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="editor-title">
      <header><div><small>NEW TRAVEL STUB</small><h1 id="editor-title">选择回忆</h1></div><button class="sheet-close" data-close="editor" type="button">×</button></header>

      <div class="wizard-step" id="media-step">
        <p class="step-title"><b>01</b><span>先选择想保存的回忆</span></p>
        <label class="field upload-field hero-upload">
          <span class="field-copy"><strong>选择实况、视频或照片</strong><small>安卓选原始动态照片；iPhone 可同时选择照片＋MOV</small></span>
          <input id="memory-upload" type="file" accept="image/*,video/*,.heic,.heif,.avif,.mov,.mp4" multiple />
          <span class="pick" id="memory-label">选择回忆</span>
        </label>
        <p class="privacy">选好回忆后，下一步才会进入票根封面设计。</p>
      </div>

      <div class="wizard-step" id="cover-step" hidden>
        <button class="wizard-back" id="back-to-media" type="button">← 重新选择回忆</button>
        <p class="step-title"><b>02</b><span>调整票根封面</span></p>
        <div class="cover-designer">
          <div class="cover-preview" id="cover-preview"><div class="preview-blur"></div><img id="cover-preview-image" alt="票根封面预览" /></div>
          <div class="layout-modes" role="group" aria-label="封面排版方式">
            <button class="active" type="button" data-cover-mode="fill"><strong>裁切填满</strong><small>长条效果更强</small></button>
            <button type="button" data-cover-mode="fit"><strong>完整显示</strong><small>模糊背景补齐</small></button>
          </div>
          <div class="crop-controls" id="crop-controls">
            <label><span>左右位置</span><input id="cover-x" type="range" min="0" max="100" value="50" /></label>
            <label><span>上下位置</span><input id="cover-y" type="range" min="0" max="100" value="50" /></label>
            <label><span>放大</span><input id="cover-zoom" type="range" min="110" max="180" value="115" /></label>
          </div>
          <p class="cover-advice" id="cover-advice">可移动和放大画面，让主体落在票根中央。</p>
        </div>
        <div class="field text-fields">
          <span class="field-no">03</span>
          <label><span>城市</span><input id="city-input" maxlength="12" placeholder="FUZHOU" value="FUZHOU" /></label>
          <label><span>日期</span><input id="date-input" maxlength="10" placeholder="2026 · 06" value="2026 · 06" /></label>
        </div>
        <div class="editor-status ready" id="editor-status"><i></i><span>封面取自所选回忆</span></div>
        <button class="create-button" id="create-ticket" type="button">完成并展示</button>
        <p class="privacy">素材只在当前设备处理，不会上传。</p>
      </div>
    </section>
  </div>

  <div class="modal" id="download-menu" hidden>
    <button class="backdrop" data-close="download-menu" aria-label="关闭下载菜单"></button>
    <section class="sheet download-sheet" role="dialog" aria-modal="true" aria-labelledby="download-title">
      <header><div><small>EXPORT</small><h1 id="download-title">下载票根</h1></div><button class="sheet-close" data-close="download-menu" type="button">×</button></header>
      <button class="export-option" id="export-live" type="button"><span class="export-icon">◎</span><span><strong>实况导出</strong><small>导出完整票根定格图＋动态文件</small></span><b>→</b></button>
      <button class="export-option" id="export-video" type="button"><span class="export-icon">▶</span><span><strong>视频导出</strong><small>生成包含撕票动画的竖屏视频</small></span><b>→</b></button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
